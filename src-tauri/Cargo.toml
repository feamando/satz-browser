[package]
name = "satz-browser"
version = "0.1.0"
description = "Satz: AI-Native Browser (Phase 0 Shell - Conversations as Tabs, Focus Mode, Compare View)"
authors = ["Nikita Gorshkov"]
edition = "2021"

[lib]
name = "satz_browser_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.4.0", features = [] }

[dependencies]
tauri = { version = "=2.8.2", features = ["unstable", "custom-protocol"] }
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"
rusqlite = { version = "=0.29.0", features = ["bundled"] }
url = "=2.5.4"
