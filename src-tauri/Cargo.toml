[package]
name = "satz-browser"
version = "0.5.0"
description = "Satz: AI-Native Browser (v0.5 Parity, Trust, Agents)"
authors = ["Nikita Gorshkov"]
edition = "2021"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[lib]
name = "satz_browser_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.4.0", features = [] }

[dependencies]
tauri = { version = "=2.8.2", features = ["unstable", "custom-protocol"] }
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"
rusqlite = { version = "=0.29.0", features = ["bundled"] }
url = "=2.5.4"

[target.'cfg(windows)'.dependencies]
webview2-com = "=0.38.2"
windows = "=0.61.3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"
objc2-foundation = "=0.3.2"
objc2-web-kit = "=0.3.2"
block2 = "=0.6.2"
