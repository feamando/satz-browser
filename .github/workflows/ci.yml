name: CI Cross-Platform Check

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "src-tauri/**"
      - "sidecar/**"
      - "scripts/**"
      - "dev/agents/hooks/**"
      - ".github/workflows/**"
      - "package.json"
      - "package-lock.json"
  pull_request:
    paths:
      - "src/**"
      - "src-tauri/**"
      - "sidecar/**"
      - "scripts/**"
      - "dev/agents/hooks/**"
      - ".github/workflows/**"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install frontend dependencies & verify TypeScript/Vite/i18n
        run: |
          npm ci
          npm run build
          node scripts/i18n_extract.mjs --check

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          cache-on-failure: true

      - name: Run Rust test suite
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify release manifest parity & security audit
        shell: bash
        run: |
          python3 scripts/release_version.py status
          python3 scripts/security_audit.py scan --mode all
