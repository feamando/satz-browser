name: Release Preview Builds

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to build/publish (e.g. v0.5.1)"
        required: true
        default: "v0.5.1"

permissions:
  contents: write

jobs:
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: "--config src-tauri/tauri.bundle.conf.json"
          - platform: macos-latest
            args: "--config src-tauri/tauri.bundle.conf.json"

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install frontend dependencies
        run: npm ci

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          cache-on-failure: true

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Restore staged Python runtime cache
        uses: actions/cache@v4
        with:
          path: src-tauri/target/staged-resources/python-runtime
          key: ${{ runner.os }}-pyruntime-${{ hashFiles('sidecar/requirements-runtime.txt') }}-v1

      - name: Stage sidecar & relocatable Python runtime
        shell: bash
        run: |
          uv python install 3.12 --managed-python
          PY_BIN="$(uv python find 3.12 --managed-python)"
          "$PY_BIN" scripts/prepare_sidecar_bundle.py

      - name: Build & publish signed Tauri bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ inputs.tag_name || github.ref_name }}
          releaseName: "Satz Browser __VERSION__"
          releaseBody: |
            ## Preview Install Notes

            - **macOS (unsigned preview):** Drag `satz.app` from the `.dmg` into `/Applications`, then run once in Terminal before opening:
              ```bash
              xattr -cr /Applications/satz.app
              ```
            - **Windows:** Run `*_x64-setup.exe`. If SmartScreen appears, choose **More info -> Run anyway**.
            - **Updating existing installs:** Open **Settings -> Appearance & Language -> App updates** -> **Check for updates** (your Brain, Vault, Mail, and downloaded local models stay untouched in AppData).
          releaseDraft: true
          prerelease: true
          args: ${{ matrix.args }}
